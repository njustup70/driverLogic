name: driver

x-common-env: &common_env
  DISPLAY: ${DISPLAY}
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all
  OMP_WAIT_POLICY: passive
  TERM: xterm-256color
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  ROS_LOCALHOST_ONLY: 1

x-common: &common
  tty: true
  network_mode: host
  pid: "host"
  ipc: "host"
  privileged: true
  user: "Elaina"
  stdin_open: true

services:
  zenoh_service:
    image: elainasuki/rc2026:driverLogic
    container_name: zenoh_runtime
    restart: always
    <<: *common
    entrypoint:
      - /bin/bash
      - -i
      - -c
      - |
        if pgrep -x 'rmw_zenohd' >/dev/null; then
          echo '[zenoh] rmw_zenohd already running'
          exec sleep infinity
        else
          echo '[zenoh] starting rmw_zenohd...'
          exec ros2 run rmw_zenoh_cpp rmw_zenohd
        fi
  driverLogic_service:
    image: elainasuki/rc2026:driverLogic
    container_name: driverLogic_runtime
    restart: always
    <<: *common
    environment:
      <<: *common_env
      PYTHONPATH: /home/Elaina/ros2_ws/src:$$PYTHONPATH
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - driverLogic_volume:/home/Elaina/ros2_ws
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
    working_dir: "/home/Elaina/ros2_ws"
    entrypoint: ["/bin/bash", "-i", "-c", "source ~/ros2_ws/package/ws_livox/install/setup.bash && source ~/.bashrc && ros2 launch rc_bringup R1.launch.py"]
  voxel_service:
    image: elainasuki/rc2026:voxel_slam_ros2
    container_name: voxel_slam_ros2_runtime
    restart: always
    <<: *common
    environment:
      <<: *common_env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - voxel_ros2_volume:/home/Elaina/ros2_ws
    working_dir: "/home/Elaina/slam/VoxelSlam"
    entrypoint: ["/bin/bash", "-i", "-c", "source ~/ros2_ws/package/ws_livox/install/setup.bash && source ~/ros2_ws/install/setup.bash && ros2 launch voxel_slam vxlm_mid360.launch.py"]
volumes:
  driverLogic_volume:
    external: true
    name: driverLogic_volume
  voxel_ros2_volume:
    external: true
    name: voxel_ros2_volume

